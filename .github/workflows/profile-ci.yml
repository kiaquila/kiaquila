name: profile-ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-checks:
    name: baseline-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.18.0"
      - name: Test native review gate
        run: node --test tests/*.test.mjs
      - name: Validate profile artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s DESIGN.md
          test -s profile-preview.html
          test -s assets/kristina-github-pipeline.gif
          test -s assets/kristina-github-pipeline-static.png
          grep -Fq '<picture>' README.md
          grep -Fq 'srcset="./assets/kristina-github-pipeline-static.png"' README.md
          grep -Fq 'srcset="assets/kristina-github-pipeline-static.png"' profile-preview.html
          grep -Fq '<!doctype html>' profile-preview.html

  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject unresolved or stale content
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '^(<<<<<<<|=======|>>>>>>>)' -- README.md DESIGN.md profile-preview.html
          ! grep -RInF 'kristina@ks-design.art' -- README.md profile-preview.html
          git diff --check

  ai-review:
    name: AI Review
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify approved profile copy contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'AI Web Designer & Web Developer & Illustrator · Building AI Workflows & Automation' README.md
          grep -Fq "I use AI to design websites and illustrations that don't feel AI-made" README.md
          grep -Fq 'label=Unicorn-hub' README.md
          grep -Fq 'https://ks-design.art' README.md
          grep -Fq 'badge/Portfolio-4B9DDC' README.md
          grep -Fq 'href="https://ks-design.art"' profile-preview.html
          grep -Fq 'badge/Portfolio-4B9DDC' profile-preview.html
          ! grep -Fq 'logo=googlechrome' README.md
          ! grep -Fq 'logo=googlechrome' profile-preview.html
          ! grep -Fq 'https://tr.pinterest.com/ks_aquila' README.md
          ! grep -Fq 'https://www.instagram.com/ks_aquila' README.md
          ! grep -Fq 'https://tr.pinterest.com/ks_aquila' profile-preview.html
          ! grep -Fq 'https://www.instagram.com/ks_aquila' profile-preview.html
          grep -Fq 'https://t.me/ks_aquila' README.md
          grep -Fq 'mailto:ks@ks-design.art' README.md
          grep -Fq '## Contribution sky' README.md
      - name: Setup Node for native review
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.18.0"
      - name: Require native Codex review of the current head
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          CODEX_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CODEX_REVIEW_WAIT_MS: "900000"
        run: node scripts/check-codex-review.mjs
